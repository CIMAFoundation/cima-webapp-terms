@if (snackbar) {
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    <div
      class="toast show"
      [class.bg-success]="snackbar.type === 'success'"
      [class.bg-danger]="snackbar.type === 'error'"
      [class.bg-secondary]="snackbar.type === 'info'"
      role="alert"
      style="min-width: 250px;"
    >
      <div class="d-flex justify-content-between align-items-center text-white">
        <div class="toast-body">{{ snackbar.text }}</div>
        <button type="button" class="btn-close btn-close-white ms-2" (click)="dismissed.emit()"></button>
      </div>
    </div>
  </div>
}
